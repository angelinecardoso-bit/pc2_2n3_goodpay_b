<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoodPay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./bootstrap/styles_complements.css">
</head>

<body>
    <header>
        <section name="navbar-site">
            <nav class="navbar navbar-dark bg-dark fixed-top">
                <div class="container">
                    <a class="navbar-brand" href="#">
                        <img src="./assets/logo_claro.png" alt="Logo Marca" width="45px" height="45px">
                    </a>
                    <div class="img-fluid">
                        <img src="../public/assets/letreiro_claro.png" alt="Letreiro" width="25%">
                    </div>
                    <div class="icon">
                        <h5><i class="bi bi-instagram text-success"></i></h5>
                    </div>
                    <div class="icon">
                        <h5><i class="bi bi-youtube text-success"></i></h5>
                    </div>
                    <div class="icon">
                        <h5><i class="bi bi-facebook text-success"></i></h5>
                    </div>
                    <div class="icon">
                        <h5><i class="bi bi-twitter text-success"></i></h5>
                    </div>
                    <div class="icon">
                        <h5><i class="bi bi-tiktok text-success"></i></h5>
                    </div>
                    <div class="icon">
                        <h5><i class="bi bi-line text-success"></i></h5>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-success">
                            <i class="bi bi-piggy-bank-fill text-white"></i> Seus Ecopoints
                        </button>
                        <button type="button" class="btn btn-success dropdown-toggle dropdown-toggle-split"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="visually-hidden">Ecopoints</span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Conta</a></li>
                            <li><a class="dropdown-item" href="#">Histórico de Ecopoints</a></li>
                            <li><a class="dropdown-item" href="#">Saldo e Extratos</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Sair da conta</a></li>
                        </ul>
                    </div>
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="offcanvas offcanvas-end bg-dark" tabindex="-1" id="offcanvasNavbar"
                        aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <img src="./assets/letreiro_claro.png" alt="Menu Titulo" width="100%">
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                                aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body bg-dark">
                            <hr>
                            <div>
                                <div class="input-group">
                                    <span class="input-group-text" id="inputGroup-sizing-default">e-mail</span>
                                    <input type="email" class="form-control" aria-label="Sizing example input"
                                        aria-describedby="inputGroup-sizing-default" id="emailLogin">
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text" id="inputGroup-sizing-default">senha</span>
                                    <input type="password" class="form-control" aria-label="Sizing example input"
                                        aria-describedby="inputGroup-sizing-default" id="senhaLogin">
                                </div>
                                <br>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-success" type="button"
                                        onclick="intializeLogin()">Entrar</button>
                                    <button class="btn btn-outline-success" type="button">Cadastrar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </section>
    </header>
    <main>
        <section name="area-assinante" style="margin-top: 5%;">
            <div class="container">
                <div class="card mb-3" style="max-width: 100%">
                    <div class="row g-0">
                        <div class="col-md-4">
                            <span id="load-img"></span>
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title" id="load-nome">Card title</h5>
                                <p class="card-text" id="load-email">E-mail do usuário</p>
                                <p class="card-text"><small class="text-body-secondary" id="load-data">data atualizaçao</small>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <script src="./engine/index.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"></script>
    </footer>

</body>

</html>
